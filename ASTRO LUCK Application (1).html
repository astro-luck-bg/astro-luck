<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTRO LUCK - Моята Лична Програма</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0d0a1a 0%, #17102b 50%, #080512 100%);
            color: #f1f5f9;
            min-height: 100vh;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-gold {
            background: rgba(245, 158, 11, 0.06);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [tab, setTab] = useState('astro');
            const [coffeeImages, setCoffeeImages] = useState({ bottom: null, wall: null, saucer: null });
            const [analyzing, setAnalyzing] = useState(false);
            const [analyzed, setAnalyzed] = useState(false);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [tab, analyzed, coffeeImages]);

            const handleImageChange = (key, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setCoffeeImages(prev => ({ ...prev, [key]: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const runAnalysis = () => {
                setAnalyzing(true);
                setTimeout(() => {
                    setAnalyzing(false);
                    setAnalyzed(true);
                }, 1800);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen px-4 py-6 flex flex-col">
                    {/* Header */}
                    <header className="glass-gold p-4 rounded-2xl text-center mb-5 relative overflow-hidden">
                        <div className="flex items-center justify-center gap-2 mb-1">
                            <i data-lucide="sparkles" className="w-6 h-6 text-amber-400"></i>
                            <h1 className="text-2xl font-bold font-cinzel text-amber-300 tracking-wider">ASTRO LUCK</h1>
                        </div>
                        <p className="text-xs text-amber-200/80">Вашата Лична Програма</p>
                        <div className="mt-3 inline-block bg-amber-500/20 px-3 py-1 rounded-full text-xs text-amber-300 border border-amber-500/30">
                            👤 12.09.1976 (12:15 ч. София) • Дева / Стрелец
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="grid grid-cols-3 gap-2 mb-5">
                        <button 
                            onClick={() => setTab('astro')}
                            className={`py-3 px-2 text-xs font-semibold rounded-xl flex flex-col items-center gap-1 transition ${tab === 'astro' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg border border-purple-400/40' : 'glass-card text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="moon" className="w-4 h-4"></i>
                            🔮 Астрология
                        </button>

                        <button 
                            onClick={() => setTab('lottery')}
                            className={`py-3 px-2 text-xs font-semibold rounded-xl flex flex-col items-center gap-1 transition ${tab === 'lottery' ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-lg border border-amber-400/40' : 'glass-card text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="clover" className="w-4 h-4"></i>
                            🎰 Лотарии
                        </button>

                        <button 
                            onClick={() => setTab('coffee')}
                            className={`py-3 px-2 text-xs font-semibold rounded-xl flex flex-col items-center gap-1 transition ${tab === 'coffee' ? 'bg-gradient-to-r from-amber-700 to-yellow-800 text-white shadow-lg border border-amber-600/40' : 'glass-card text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="coffee" className="w-4 h-4"></i>
                            ☕ Моето Кафе
                        </button>
                    </div>

                    {/* TAB: ASTROLOGY */}
                    {tab === 'astro' && (
                        <div className="space-y-4">
                            <div className="glass-gold p-5 rounded-2xl">
                                <div className="flex justify-between items-center mb-2 border-b border-amber-500/20 pb-2">
                                    <h2 className="text-base font-bold text-amber-300 flex items-center gap-2">
                                        <i data-lucide="sun" className="w-5 h-5 text-amber-400"></i> Дневен хороскоп
                                    </h2>
                                    <span className="text-xs text-slate-400">{new Date().toLocaleDateString('bg-BG')}</span>
                                </div>
                                <p className="text-sm text-slate-200 leading-relaxed mt-2">
                                    Днешният ден ви носи много добър баланс между прагматизма на **Девата** и стремежа към нови хоризонти на вашия асцендент **Стрелец**. Звездите са във ваша подкрепа за професионално развитие.
                                </p>
                            </div>

                            <div className="glass-card p-4 rounded-2xl space-y-4">
                                <div className="flex items-start gap-3">
                                    <div className="p-2 bg-emerald-500/10 rounded-lg text-emerald-400 border border-emerald-500/30">
                                        <i data-lucide="hotel" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-semibold text-emerald-300">💼 Работа & Нов Хотел</h3>
                                        <p className="text-xs text-slate-300 mt-1">
                                            Аспектите подкрепят документите ви за **Blau Cala Mandia**. Очаквайте положително развитие и подкрепа от ръководството.
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-start gap-3 border-t border-slate-700/60 pt-3">
                                    <div className="p-2 bg-amber-500/10 rounded-lg text-amber-400 border border-amber-500/30">
                                        <i data-lucide="coins" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-semibold text-amber-300">💰 Финанси & Късмет</h3>
                                        <p className="text-xs text-slate-300 mt-1">
                                            Стабилен финансов поток. Денят резонира силно с вашите числа на късмета.
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-start gap-3 border-t border-slate-700/60 pt-3">
                                    <div className="p-2 bg-rose-500/10 rounded-lg text-rose-400 border border-rose-500/30">
                                        <i data-lucide="heart" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-semibold text-rose-300">🌿 Здраве & Енергия</h3>
                                        <p className="text-xs text-slate-300 mt-1">
                                            Добро общо състояние. Спокойствието и вярата в успеха са вашите най-добри съюзници.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB: LOTTERY */}
                    {tab === 'lottery' && (
                        <div className="space-y-4">
                            <div className="glass-gold p-4 rounded-2xl text-center">
                                <h2 className="text-base font-bold text-amber-300 font-cinzel">🎰 Лотарии за Деня</h2>
                                <p className="text-xs text-slate-300 mt-1">Генерирани според наталната ви карта (12.09.1976)</p>
                            </div>

                            {/* Bonoloto */}
                            <div className="glass-card p-4 rounded-2xl border border-amber-500/30">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-sm font-bold text-amber-400">🎟️ Bonoloto</span>
                                    <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full">6 от 49</span>
                                </div>
                                <div className="flex justify-around items-center my-2">
                                    {[7, 12, 19, 25, 33, 41].map((n, i) => (
                                        <span key={i} className="w-8 h-8 flex items-center justify-center font-bold text-slate-950 bg-amber-400 rounded-full text-sm shadow">
                                            {n}
                                        </span>
                                    ))}
                                </div>
                                <div className="text-center mt-2 text-xs text-amber-200">Reintegro: <b>4</b></div>
                            </div>

                            {/* La Primitiva */}
                            <div className="glass-card p-4 rounded-2xl border border-indigo-500/30">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-sm font-bold text-indigo-300">👑 La Primitiva</span>
                                    <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full">6 от 49</span>
                                </div>
                                <div className="flex justify-around items-center my-2">
                                    {[3, 12, 21, 28, 37, 44].map((n, i) => (
                                        <span key={i} className="w-8 h-8 flex items-center justify-center font-bold text-white bg-indigo-600 rounded-full text-sm shadow">
                                            {n}
                                        </span>
                                    ))}
                                </div>
                                <div className="text-center mt-2 text-xs text-indigo-200">Reintegro: <b>9</b></div>
                            </div>

                            {/* EuroMillions */}
                            <div className="glass-card p-4 rounded-2xl border border-blue-500/30">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-sm font-bold text-blue-300">⭐ EuroMillions</span>
                                    <span className="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full">5 + 2</span>
                                </div>
                                <div className="flex justify-around items-center my-2">
                                    {[7, 14, 23, 31, 42].map((n, i) => (
                                        <span key={i} className="w-8 h-8 flex items-center justify-center font-bold text-slate-950 bg-blue-300 rounded-full text-sm shadow">
                                            {n}
                                        </span>
                                    ))}
                                </div>
                                <div className="flex justify-center gap-3 mt-3 pt-2 border-t border-slate-700/50">
                                    <span className="text-xs text-amber-300">Lucky Stars:</span>
                                    <span className="w-6 h-6 flex items-center justify-center font-bold text-slate-950 bg-amber-400 rounded-full text-xs">★ 3</span>
                                    <span className="w-6 h-6 flex items-center justify-center font-bold text-slate-950 bg-amber-400 rounded-full text-xs">★ 9</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB: COFFEE */}
                    {tab === 'coffee' && (
                        <div className="space-y-4">
                            <div className="glass-gold p-4 rounded-2xl text-center">
                                <h2 className="text-base font-bold text-amber-300 font-cinzel">☕ Моето Кафе</h2>
                                <p className="text-xs text-slate-300 mt-1">Качете снимки на вашата чаша за разчитане</p>
                            </div>

                            {/* Image Grid */}
                            <div className="grid grid-cols-3 gap-2">
                                {[
                                    { key: 'bottom', label: '1. Дъно' },
                                    { key: 'wall', label: '2. Стени' },
                                    { key: 'saucer', label: '3. Чинийка' }
                                ].map(item => (
                                    <label key={item.key} className="glass-card p-2 rounded-xl flex flex-col items-center justify-center min-h-[90px] border border-dashed border-amber-500/30 cursor-pointer relative overflow-hidden">
                                        {coffeeImages[item.key] ? (
                                            <img src={coffeeImages[item.key]} className="absolute inset-0 w-full h-full object-cover" />
                                        ) : (
                                            <>
                                                <i data-lucide="camera" className="w-5 h-5 text-amber-400 mb-1"></i>
                                                <span className="text-xs text-slate-300">{item.label}</span>
                                            </>
                                        )}
                                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageChange(item.key, e)} />
                                    </label>
                                ))}
                            </div>

                            <button 
                                onClick={runAnalysis}
                                disabled={analyzing}
                                className="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-700 text-slate-950 font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 hover:brightness-110"
                            >
                                {analyzing ? (
                                    <span>Разчитане на символите...</span>
                                ) : (
                                    <>
                                        <i data-lucide="sparkles" className="w-5 h-5"></i>
                                        <span>Тълкувай Чашата</span>
                                    </>
                                )}
                            </button>

                            {/* Analysis Result */}
                            {(analyzed || true) && (
                                <div className="glass-card p-4 rounded-2xl space-y-3 border border-amber-500/30">
                                    <div className="border-b border-amber-500/20 pb-2 flex justify-between items-center">
                                        <h3 className="text-sm font-bold text-amber-300">✨ Тълкуване за Преместването</h3>
                                        <span className="text-xs text-emerald-400 font-medium">Период: 7 - 14 дни</span>
                                    </div>

                                    <div className="space-y-2 text-xs text-slate-300">
                                        <p><b className="text-amber-300">🏨 Blau Cala Mandia:</b> Символите в чашата показват отворен път и преминаване към ново място. Молбата ви за преместване има много висок шанс за одобрение.</p>
                                        <p><b className="text-amber-300">💰 Пари & Успех:</b> Очаква се положителна промяна във финансово отношение с новото работно място.</p>
                                        <p><b className="text-amber-300">🌟 Послание:</b> "Бъдете спокойни – пътят пред вас е чист и промяната идва в правилния момент."</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    <footer className="mt-auto pt-6 text-center text-[11px] text-slate-400">
                        ASTRO LUCK • Вашият персонален вечен дневен портал
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
